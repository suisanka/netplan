version: 1

# Review every selector/path before using --live. This is a schema example, not a
# configuration that is safe to apply unchanged on an arbitrary machine.

# Never mutate the interface carrying RDP, SSH, or the tunnel agent.
protect:
  management_interfaces:
    - if_index: 6

identity:
  computer_name: PE-LAB
  workgroup: WORKGROUP
  dns_suffix: lab.example

adapters:
  - selector:
      if_index: 7
      description_contains: Realtek
    enabled: true
    ipv4:
      mode: static
      addresses:
        - 192.0.2.10/24
      gateways:
        - 192.0.2.1
      dns:
        - 1.1.1.1
        - 2606:4700:4700::1111

wifi:
  - name: pe-lab
    ssid: PE-Lab-WiFi
    authentication: wpa2_personal
    psk:
      source: env
      value: NETPLAN_WIFI_PSK
    auto_connect: true
    hidden: false

wifi_actions:
  - action: scan
  - action: connect
    profile: pe-lab

smb:
  accounts:
    - id: diagnostics-user
      kind: local
      username: pe-diagnostics
      password:
        source: env
        value: NETPLAN_LOCAL_SMB_PASSWORD
    - id: fileserver
      kind: credential
      username: lab\pe
      password:
        source: env
        value: NETPLAN_REMOTE_SMB_PASSWORD
  shares:
    - name: diagnostics
      path: X:\diagnostics
      description: PE diagnostics
      read_only: false
      accounts: [diagnostics-user]
  mappings:
    - remote: '\\fileserver\images'
      local: 'Z:'
      account: fileserver

firewall:
  enabled: true

services:
  - name: LanmanServer
    state: running
  - name: LanmanWorkstation
    state: running

# Driver installation is irreversible and therefore intentionally omitted from the
# active example. Its shape is:
# drivers:
#   - action: install
#     inf_path: X:\drivers\net.inf
#     hardware_id: 'PCI\VEN_1234&DEV_5678'
#     force: false
#     restart: if_required
#   - action: restart_adapter
#     selector: { if_index: 7 }

hooks:
  - stage: after_apply
    program: X:\Windows\System32\ipconfig.exe
    args: [/all]
    wait: true
