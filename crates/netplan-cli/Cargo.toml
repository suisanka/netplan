[package]
name = "netplan-cli"
description = "CLI and JSON-RPC gateway for PE Netplan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "netplan"
path = "src/main.rs"
doc = false

[dependencies]
clap.workspace = true
netplan = { path = "../netplan", version = "0.1.0" }
