[workspace]
resolver = "3"
members = [
    "crates/netplan",
    "crates/netplan-cli",
    "crates/netplan-ffi",
    "crates/netpland",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/suisanka/netplan"
homepage = "https://github.com/suisanka/netplan"
authors = ["PE Netplan contributors"]

[workspace.dependencies]
clap = { version = "4.6.5", features = ["derive"] }
flatbuffers = "25.12.19"
ipnet = { version = "2.11.0", features = ["serde"] }
mimalloc = { version = "=0.1.52", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
serde-saphyr = "1.0.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
vc-ltl = "=5.3.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_NetworkManagement_WNet",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Services",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
